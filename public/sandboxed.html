<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>SankaVerse Stream Bridge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #09090b;
      color: #f4f4f5;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      max-width: 440px;
      padding: 24px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
    }
    h3 { color: #f87171; font-size: 15px; margin-bottom: 8px; }
    p { font-size: 12px; color: #a1a1aa; line-height: 1.5; margin-bottom: 16px; }
    .btn {
      display: inline-block;
      background: #dc2626;
      color: white;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 12px;
      text-decoration: none;
      cursor: pointer;
      font-weight: bold;
      border: none;
      transition: background 0.2s;
    }
    .btn:hover { background: #b91c1c; }
  </style>
</head>
<body>
  <div class="card">
    <h3>⚡ Pemutaran Berlanjut</h3>
    <p>Menyambungkan koneksi langsung ke player video tanpa batasan iframe...</p>
    <div style="display: flex; gap: 8px; justify-content: center;">
      <button class="btn" onclick="window.parent.postMessage({ type: 'SANKA_SWITCH_DIRECT' }, '*')">Putar Langsung</button>
      <button class="btn" style="background: #27272a;" onclick="window.parent.postMessage({ type: 'SANKA_OPEN_POPOUT' }, '*')">Buka Popout</button>
    </div>
  </div>
  <script>
    // Automatically signal parent player to switch to direct embed with user residential IP
    try {
      window.parent.postMessage({ type: 'SANKA_SWITCH_DIRECT' }, '*');
    } catch(e) {}
  </script>
</body>
</html>
